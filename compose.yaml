name: nfl-research-dev

services:
  db:
    image: postgres:17-bookworm
    command: [postgres, -c, timezone=UTC]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      APP_DB_HOST: db
      APP_DB_PORT: '5432'
      APP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      APP_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:8000:8000'
    networks: [default, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - '127.0.0.1:5173:5173'
    networks: [default]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  ingestion:
    build: ./backend
    profiles: [ingestion]
    environment:
      APP_DB_HOST: db
      APP_DB_PORT: '5432'
      APP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      APP_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: [python, -m, ingestion.schedule, --file, /data/raw/games.csv, --dry-run]
    volumes:
      - ./data/raw:/data/raw:ro
      - schedule_snapshots:/app/snapshots
    networks: [database]
    depends_on:
      db:
        condition: service_healthy

  db_test:
    image: postgres:17-bookworm
    command: [postgres, -c, timezone=UTC]
    profiles: [test]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nfl_research_test
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test_database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d nfl_research_test']
      interval: 2s
      timeout: 5s
      retries: 15

  tests:
    build: ./backend
    profiles: [test]
    environment:
      APP_DB_HOST: db_test
      APP_DB_PORT: '5432'
      APP_DB_NAME: nfl_research_test
      APP_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RUN_DATABASE_TESTS: '1'
    command: [python, -m, pytest, -q, -ra]
    networks: [test_database]
    depends_on:
      db_test:
        condition: service_healthy

volumes:
  postgres_dev:
  schedule_snapshots:

networks:
  database:
    internal: true
  test_database:
    internal: true
